<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book</title>
</head>
<body>
<p th:text="${book.getName()} + ', ' + ${book.getAuthor()} + ', ' + ${book.getYear()}"></p>


<div th:with="personExists=${book.person != null}">

    <form th:method="PATCH" th:action="@{/books/{id}(id=${book.getId()})}">
        <div th:if="${personExists}">
            <p th:text="'Владелец книги: ' + ${book.getPerson().getName()}"></p>
            <input type="submit" value="Освободить книгу">
        </div>
    </form>

    <form th:method="PATCH" th:action="@{/books/{id}(id=${book.getId()})}">
        <div th:unless="${personExists}">
            <p th:text="'Эта книга свободна. Кому назначить ее?'"></p>
            <label for="person" th:text="'Выберите человека: '"></label>
            <select name="personId" id="person">
                <option th:each="person : ${people}" th:value="${person.getId()}" th:text="${person.getName()}"></option>
            </select>
            <input type="submit" value="Назначить книгу">
        </div>
    </form>

</div>

<hr/>
<form th:method="GET" th:action="@{{id}/edit(id=${book.getId()})}">
    <input type="submit" value="Редактировать">
</form>
<form th:method="DELETE" th:action="@{/books/{id}(id=${book.getId()})}">
    <input type="submit" value="Удалить">
</form>

</body>
</html>
