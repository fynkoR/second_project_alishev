<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>New book</title>
</head>
<body>

<form th:method="POST" th:action="@{/books}" th:object="${book}">
  <label for="name">Введите название книги:</label>
  <input type="text" id="name" th:field="*{name}">
  <div style="color: red" th:if="${#fields.hasErrors()}" th:errors="*{name}">Name error</div>
  <br/>
  <label for="author">Введите автора:</label>
  <input type="text" id="author" th:field="*{author}">
  <div style="color: red" th:if="${#fields.hasErrors()}" th:errors="*{author}">Author error</div>
  <br/>
  <label for="year">Введите год:</label>
  <input type="text" id="year" th:field="*{year}">
  <div style="color: red" th:if="${#fields.hasErrors()}" th:errors="*{year}">Author error</div>
  <br/>
  <input type="submit" value="Создать!">
</form>

</body>
</html>
